<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek V4 视频 - 静态预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #4ECDC4;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    /* 主布局：左右分栏 */
    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* 左侧：场景预览 */
    .left-panel {
      flex: 1;
      min-width: 0;
    }

    .scene-block {
      margin-bottom: 30px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }

    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .scene-title {
      font-size: 16px;
      font-weight: 600;
      color: #4ECDC4;
    }

    .scene-time {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      font-family: "JetBrains Mono", monospace;
    }

    .scene-frame {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1920/1080;
    }

    .scene-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: 0 0;
    }

    /* 右侧：时间线 */
    .right-panel {
      width: 300px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .timeline-title {
      font-size: 16px;
      font-weight: 600;
      color: #4ECDC4;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #4ECDC4, #556270);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 24px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 4px;
      width: 10px;
      height: 10px;
      background: #4ECDC4;
      border-radius: 50%;
      border: 2px solid #0a0a0f;
    }

    .timeline-item.active::before {
      background: #FFE66D;
      box-shadow: 0 0 10px #FFE66D;
    }

    .timeline-scene {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .timeline-range {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-family: "JetBrains Mono", monospace;
    }

    .timeline-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* 总时长 */
    .total-duration {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }

    .total-duration span {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    .total-duration .duration {
      font-size: 24px;
      font-weight: 700;
      color: #4ECDC4;
      font-family: "JetBrains Mono", monospace;
    }

    /* 阶段提示 */
    .stage-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(78,205,196,0.15);
      border: 1px solid rgba(78,205,196,0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #4ECDC4;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DeepSeek V4 发布视频</h1>
    <p>阶段一：静态布局确认</p>
  </div>

  <div class="main-container">
    <!-- 左侧：场景预览 -->
    <div class="left-panel">
      <!-- 第一幕 -->
      <div class="scene-block">
        <div class="scene-header">
          <span class="scene-title">第一幕：Logo 入场</span>
          <span class="scene-time">0.0s - 5.0s</span>
        </div>
        <div class="scene-frame">
          <iframe src="scene-1.html"></iframe>
        </div>
      </div>

      <!-- 第二幕 -->
      <div class="scene-block">
        <div class="scene-header">
          <span class="scene-title">第二幕：能力展示</span>
          <span class="scene-time">5.0s - 10.0s</span>
        </div>
        <div class="scene-frame">
          <iframe src="scene-2.html"></iframe>
        </div>
      </div>

      <!-- 第三幕 -->
      <div class="scene-block">
        <div class="scene-header">
          <span class="scene-title">第三幕：数据展示</span>
          <span class="scene-time">10.0s - 15.0s</span>
        </div>
        <div class="scene-frame">
          <iframe src="scene-3.html"></iframe>
        </div>
      </div>

      <!-- 第四幕 -->
      <div class="scene-block">
        <div class="scene-header">
          <span class="scene-title">第四幕：结尾号召</span>
          <span class="scene-time">15.0s - 20.0s</span>
        </div>
        <div class="scene-frame">
          <iframe src="scene-4.html"></iframe>
        </div>
      </div>
    </div>

    <!-- 右侧：时间线 -->
    <div class="right-panel">
      <div class="timeline-title">时间线</div>
      <div class="timeline">
        <div class="timeline-item active">
          <div class="timeline-scene">第一幕</div>
          <div class="timeline-range">0.0s - 5.0s</div>
          <div class="timeline-desc">Logo 入场<br>光晕扩散<br>版本号打字</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-scene">第二幕</div>
          <div class="timeline-range">5.0s - 10.0s</div>
          <div class="timeline-desc">代码生成<br>深度推理<br>多模态理解</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-scene">第三幕</div>
          <div class="timeline-range">10.0s - 15.0s</div>
          <div class="timeline-desc">95% 准确率<br>3x 速度提升<br>1M 日活用户</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-scene">第四幕</div>
          <div class="timeline-range">15.0s - 20.0s</div>
          <div class="timeline-desc">"非常强大"<br>立即体验按钮</div>
        </div>
      </div>

      <div class="total-duration">
        <span>总时长</span>
        <div class="duration">20.0s</div>
      </div>

      <div style="text-align: center;">
        <span class="stage-badge">阶段一：静态布局</span>
      </div>
    </div>
  </div>

  <script>
    // 动态计算 iframe 缩放比例
    function updateIframeScales() {
      const frames = document.querySelectorAll('.scene-frame');
      frames.forEach(frame => {
        const iframe = frame.querySelector('iframe');
        if (iframe) {
          const containerWidth = frame.clientWidth;
          const scale = containerWidth / 1920;
          iframe.style.transform = `scale(${scale})`;
          frame.style.height = `${1080 * scale}px`;
        }
      });
    }

    window.addEventListener('load', updateIframeScales);
    window.addEventListener('resize', updateIframeScales);
  </script>
</body>
</html>
