<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; position: relative; }
.left-panel { width: 400px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
.step-num { width: 56px; height: 56px; border-radius: 50%; background: white; color: #1a73e8; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.step-icon { width: 40px; height: 40px; margin-bottom: 16px; }
.phase-label { color: rgba(255,255,255,0.8); font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.phase-title { color: white; font-size: 36px; font-weight: 800; }
.right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px; }
.card { width: 600px; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px; box-shadow: 0 12px 48px rgba(0,0,0,0.12); }
.card-icon { width: 48px; height: 48px; background: #e3f2fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.card-title { color: #1a73e8; font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.card-desc { color: #666; font-size: 16px; line-height: 1.8; }
.card-list { list-style: none; margin-top: 16px; }
.card-list li { padding: 8px 0; color: #555; font-size: 15px; display: flex; align-items: center; gap: 12px; }
.card-list li::before { content: ""; width: 8px; height: 8px; background: #1a73e8; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="scene">
  <div class="left-panel">
    <div class="step-num">1</div>
    <svg class="step-icon" viewBox="0 0 40 40" fill="none"><path d="M10 30l10-20 10 20H10z" fill="white"/><rect x="16" y="22" width="8" height="8" fill="#1a73e8"/></svg>
    <div class="phase-label">阶段一</div>
    <div class="phase-title">静态布局设计</div>
  </div>
  <div class="right-panel">
    <div class="card">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#1a73e8" stroke-width="2"/><line x1="3" y1="9" x2="21" y2="9" stroke="#1a73e8" stroke-width="2"/></svg>
      </div>
      <div class="card-title">确定视觉元素和布局</div>
      <div class="card-desc">生成纯 HTML/CSS 静态页面，供用户在浏览器中确认布局效果</div>
      <ul class="card-list">
        <li>元素定义表</li>
        <li>分幕画面设计</li>
        <li>最终布局 ASCII 图</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
