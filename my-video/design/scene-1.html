<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; opacity: 0; }
.particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.15); opacity: 0; }
.p1 { width:20px;height:20px;top:80px;left:200px; }
.p2 { width:14px;height:14px;top:150px;left:900px; }
.p3 { width:28px;height:28px;top:500px;left:150px; }
.p4 { width:10px;height:10px;top:600px;left:1000px; }
.p5 { width:18px;height:18px;top:100px;left:600px; }
.p6 { width:12px;height:12px;top:400px;left:1100px; }
.logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
.logo-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); opacity: 0; }
.logo-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
.logo-icon svg { width: 48px; height: 48px; }
.logo-text { color: white; font-size: 28px; font-weight: 600; letter-spacing: 2px; opacity: 0; }
.title { color: white; font-size: 64px; font-weight: 800; text-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 20px; }
.subtitle { color: rgba(255,255,255,0.9); font-size: 28px; font-weight: 400; letter-spacing: 4px; }
</style>
</head>
<body>
<div class="scene" id="scene-bg">
  <div class="particle p1" id="p1"></div>
  <div class="particle p2" id="p2"></div>
  <div class="particle p3" id="p3"></div>
  <div class="particle p4" id="p4"></div>
  <div class="particle p5" id="p5"></div>
  <div class="particle p6" id="p6"></div>
  <div class="logo" id="logo-group">
    <div class="logo-icon" id="logo-icon">
      <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#1a73e8"/><path d="M14 24h20M24 14v20" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <span class="logo-text" id="logo-text">HyperFrames</span>
  </div>
  <div class="title" id="title">Video Design</div>
  <div class="subtitle" id="subtitle">四阶段视频设计工作流</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function() {
  var tl = gsap.timeline({ paused: true });

  tl.to('#scene-bg', { opacity: 1, duration: 1, ease: 'power2.in' }, 0)
    .to(['#p1','#p2','#p3','#p4','#p5','#p6'], { opacity: 1, duration: 0.8, stagger: 0.1 }, 0.3)
    .fromTo('#logo-icon', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.7)' }, 0.8)
    .fromTo('#logo-text', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 1.3)
    .fromTo('#title', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.in' }, 2.2)
    .fromTo('#subtitle', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 3.5)
    .to(['#p1','#p2','#p3','#p4','#p5','#p6'], { y: -15, duration: 3, repeat: 2, ease: 'sine.inOut', stagger: { each: 0.3, from: 'random' } }, 6)
    .to('#logo-icon', { scale: 1.05, duration: 2, yoyo: true, repeat: -1, ease: 'sine.inOut' }, 8);

  tl.call(function() { tl.restart(); }, null, 20);

  window.__timelines = window.__timelines || {};
  window.__timelines['scene-1'] = tl;

  tl.play();
})();
</script>
</body>
</html>
