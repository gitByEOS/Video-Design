<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; position: relative; }
.left-panel { width: 400px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
.step-num { width: 56px; height: 56px; border-radius: 50%; background: white; color: #1a73e8; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.step-icon { width: 40px; height: 40px; margin-bottom: 16px; }
.phase-label { color: rgba(255,255,255,0.8); font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.phase-title { color: white; font-size: 36px; font-weight: 800; }
.right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px; }
.card { width: 600px; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px; box-shadow: 0 12px 48px rgba(0,0,0,0.12); }
.card-icon { width: 48px; height: 48px; background: #e3f2fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.card-title { color: #1a73e8; font-size: 24px; font-weight: 700; margin-bottom: 16px; }
.gantt-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.gantt-label { width: 80px; color: #666; font-size: 14px; text-align: right; flex-shrink: 0; }
.gantt-bar { height: 28px; border-radius: 6px; flex: 1; position: relative; }
.gantt-bar span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: white; font-size: 13px; font-weight: 600; }
.bar1 { background: linear-gradient(90deg, #1a73e8, #4fc3f7); width: 30%; }
.bar2 { background: linear-gradient(90deg, #4fc3f7, #81d4fa); width: 50%; margin-left: 15%; }
.bar3 { background: linear-gradient(90deg, #81d4fa, #b3e5fc); width: 40%; margin-left: 40%; }
</style>
</head>
<body>
<div class="scene">
  <div class="left-panel">
    <div class="step-num">2</div>
    <svg class="step-icon" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="15" stroke="white" stroke-width="3" fill="none"/><path d="M20 10v10l7 4" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="phase-label">阶段二</div>
    <div class="phase-title">动态时间线设计</div>
  </div>
  <div class="right-panel">
    <div class="card">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="4" height="16" rx="1" fill="#1a73e8"/><rect x="10" y="8" width="4" height="12" rx="1" fill="#4fc3f7"/><rect x="17" y="2" width="4" height="18" rx="1" fill="#81d4fa"/></svg>
      </div>
      <div class="card-title">甘特图时间线</div>
      <div class="gantt-row">
        <span class="gantt-label">入场动画</span>
        <div class="gantt-bar bar1"><span>0s - 6s</span></div>
      </div>
      <div class="gantt-row">
        <span class="gantt-label">内容展示</span>
        <div class="gantt-bar bar2"><span>3s - 13s</span></div>
      </div>
      <div class="gantt-row">
        <span class="gantt-label">过渡转场</span>
        <div class="gantt-bar bar3"><span>10s - 20s</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
