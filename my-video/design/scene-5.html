<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; position: relative; }
.left-panel { width: 400px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
.step-num { width: 56px; height: 56px; border-radius: 50%; background: white; color: #1a73e8; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.step-icon { width: 40px; height: 40px; margin-bottom: 16px; }
.phase-label { color: rgba(255,255,255,0.8); font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.phase-title { color: white; font-size: 36px; font-weight: 800; }
.right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px; }
.card { width: 600px; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px; box-shadow: 0 12px 48px rgba(0,0,0,0.12); }
.card-icon { width: 48px; height: 48px; background: #e3f2fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.card-title { color: #1a73e8; font-size: 24px; font-weight: 700; margin-bottom: 20px; }
.output-info { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.output-badge { background: #1a73e8; color: white; padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: 700; }
.progress-wrap { margin-top: 20px; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
.progress-label span { color: #666; font-size: 14px; }
.progress-bar { height: 12px; background: #e8eaed; border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #1a73e8, #4fc3f7); border-radius: 6px; }
</style>
</head>
<body>
<div class="scene">
  <div class="left-panel">
    <div class="step-num">4</div>
    <svg class="step-icon" viewBox="0 0 40 40" fill="none"><polygon points="14,8 32,20 14,32" fill="white"/></svg>
    <div class="phase-label">阶段四</div>
    <div class="phase-title">整合交付</div>
  </div>
  <div class="right-panel">
    <div class="card">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><polygon points="8,5 19,12 8,19" fill="#1a73e8"/></svg>
      </div>
      <div class="card-title">最终输出</div>
      <div class="output-info">
        <span class="output-badge">1280×720</span>
        <span class="output-badge">MP4</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>渲染进度</span>
          <span>100%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
