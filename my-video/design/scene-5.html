<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; position: relative; }
.left-panel { width: 400px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
.step-num { width: 56px; height: 56px; border-radius: 50%; background: white; color: #1a73e8; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); opacity: 0; }
.step-icon { width: 40px; height: 40px; margin-bottom: 16px; opacity: 0; }
.phase-label { color: rgba(255,255,255,0.8); font-size: 18px; font-weight: 500; margin-bottom: 8px; opacity: 0; }
.phase-title { color: white; font-size: 36px; font-weight: 800; opacity: 0; }
.right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px; }
.card { width: 600px; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px; box-shadow: 0 12px 48px rgba(0,0,0,0.12); opacity: 0; }
.card-icon { width: 48px; height: 48px; background: #e3f2fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.card-title { color: #1a73e8; font-size: 24px; font-weight: 700; margin-bottom: 20px; }
.output-info { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.output-badge { background: #1a73e8; color: white; padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: 700; opacity: 0; display: inline-block; }
.progress-wrap { margin-top: 20px; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
.progress-label span { color: #666; font-size: 14px; }
.progress-bar { height: 12px; background: #e8eaed; border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1a73e8, #4fc3f7); border-radius: 6px; }
</style>
</head>
<body>
<div class="scene" id="scene-bg">
  <div class="left-panel">
    <div class="step-num" id="step-num">4</div>
    <svg class="step-icon" id="step-icon" viewBox="0 0 40 40" fill="none"><polygon points="14,8 32,20 14,32" fill="white"/></svg>
    <div class="phase-label" id="phase-label">阶段四</div>
    <div class="phase-title" id="phase-title">整合交付</div>
  </div>
  <div class="right-panel">
    <div class="card" id="card">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><polygon points="8,5 19,12 8,19" fill="#1a73e8"/></svg>
      </div>
      <div class="card-title">最终输出</div>
      <div class="output-info">
        <span class="output-badge" id="badge1">1280×720</span>
        <span class="output-badge" id="badge2">MP4</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>渲染进度</span>
          <span id="prog-text">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="prog-fill"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function() {
  var tl = gsap.timeline({ paused: true });

  tl.fromTo('#step-num', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.7)' }, 0.5)
    .fromTo('#step-icon', { opacity: 0, rotation: -90 }, { opacity: 1, rotation: 0, duration: 0.6 }, 1)
    .fromTo('#phase-label', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6 }, 2)
    .fromTo('#phase-title', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6 }, 2.3)
    .fromTo('#card', { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power2.out' }, 3)
    .fromTo('#badge1', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 4)
    .fromTo('#badge2', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 4.5)
    .to('#prog-fill', { width: '100%', duration: 2.5, ease: 'power2.inOut' }, 5.5)
    .to('#prog-text', {
      duration: 2.5,
      ease: 'power2.inOut',
      onUpdate: function() {
        var p = Math.round(this.progress() * 100);
        document.getElementById('prog-text').textContent = p + '%';
      }
    }, 5.5)
    .to('#prog-fill', { boxShadow: '0 0 12px rgba(26,115,232,0.5)', duration: 0.5 }, 8)
    .to('#card', { boxShadow: '0 12px 60px rgba(26,115,232,0.25)', duration: 2, yoyo: true, repeat: 2, ease: 'sine.inOut' }, 10);

  tl.call(function() { tl.restart(); }, null, 20);

  window.__timelines = window.__timelines || {};
  window.__timelines['scene-5'] = tl;

  tl.play();
})();
</script>
</body>
</html>
