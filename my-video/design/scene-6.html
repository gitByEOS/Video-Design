<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.scene { width: 1280px; height: 720px; background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 50%, #e3f2fd 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.15); }
.p1 { width:20px;height:20px;top:80px;left:200px; }
.p2 { width:14px;height:14px;top:150px;left:900px; }
.p3 { width:28px;height:28px;top:500px;left:150px; }
.p4 { width:10px;height:10px;top:600px;left:1000px; }
.p5 { width:18px;height:18px;top:100px;left:600px; }
.p6 { width:12px;height:12px;top:400px;left:1100px; }
.logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
.logo-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
.logo-icon svg { width: 48px; height: 48px; }
.logo-text { color: white; font-size: 28px; font-weight: 600; letter-spacing: 2px; }
.slogan { color: white; font-size: 32px; font-weight: 600; text-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 40px; letter-spacing: 2px; }
.cta-btn { background: white; color: #1a73e8; padding: 16px 40px; border-radius: 12px; font-size: 20px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 32px rgba(0,0,0,0.15); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="scene">
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#1a73e8"/><path d="M14 24h20M24 14v20" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <span class="logo-text">HyperFrames</span>
  </div>
  <div class="slogan">让视频创作像写文档一样简单</div>
  <div class="cta-btn">开始使用 /video-design</div>
</div>
</body>
</html>
